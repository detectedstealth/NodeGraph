# Builds and tests on every push to main and every pull request.
#
# Linux is the required check: it builds the modules that run anywhere (Core, Nodes, Sync,
# Robotics, Video, Assistant, RunKit and ng-run). The manifest leaves the Apple-only modules out on
# Linux (decision 244).
#
# macOS also builds the Apple-only modules (UI, AI, Tutorials). It runs only when started by hand,
# because a hosted runner may not have the toolchain the package needs (swift-tools-version 6.3,
# macOS 26 SDK). Once a manual run passes, delete the `if:` and `continue-on-error` lines on that job
# so it runs on every push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Swift 6.4.2)
    # Pinned to match local development (Ubuntu 24.04, Swift 6.4.2) and to avoid the ubuntu-latest
    # move to Ubuntu 26.
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      # Serial and with looser timing limits: hosted runners have two cores, and the scale and
      # concurrency tests measure time (see TimingScale.swift in the Core tests).
      - name: Test
        run: swift test --no-parallel
        env:
          NODEGRAPH_TIMING_SCALE: "4"

  macos:
    name: macOS
    # Manual only (Actions tab > CI > Run workflow) until a hosted runner has the toolchain.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      # Same serial run and timing scale as Linux, for the same reason.
      - name: Test
        run: swift test --no-parallel
        env:
          NODEGRAPH_TIMING_SCALE: "4"
