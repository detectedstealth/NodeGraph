# Builds and tests on every push to main and every pull request.
#
# Linux is the required check: it builds the modules that run anywhere (Core, Nodes, Sync,
# Robotics, Video, Assistant, RunKit and ng-run). The manifest leaves the Apple-only modules out on
# Linux (decision 244).
#
# macOS also builds and tests the Apple-only modules (UI, AI, Tutorials) on the hosted runner's
# Swift 6.3 toolchain, which is the oldest toolchain the package supports (swift-tools-version 6.3).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Swift 6.4.2)
    # Pinned to match local development (Ubuntu 24.04, Swift 6.4.2) and to avoid the ubuntu-latest
    # move to Ubuntu 26.
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      # Serial and with looser timing limits: hosted runners have two cores, and the scale and
      # concurrency tests measure time (see TimingScale.swift in the Core tests).
      - name: Test
        run: swift test --no-parallel
        env:
          NODEGRAPH_TIMING_SCALE: "4"
      # Runs every command the command-line tutorials show and checks what each prints and returns.
      - name: Install jq
        run: apt-get update && apt-get install -y jq
      - name: Command-line tutorials
        run: scripts/check-cli-tutorial.sh

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      # Same serial run and timing scale as Linux, for the same reason.
      - name: Test
        run: swift test --no-parallel
        env:
          NODEGRAPH_TIMING_SCALE: "4"
      - name: Command-line tutorials
        run: scripts/check-cli-tutorial.sh
