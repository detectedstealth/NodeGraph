# Builds the DocC site (tutorials and API reference) and publishes it to GitHub Pages.
# Needs: Settings > Pages > Source set to "GitHub Actions" (a public repo, or a paid plan). The
# macos-latest runner has the toolchain the package needs (CI builds and tests on it). Not yet run
# on GitHub: see docs/TUTORIALS.md.
name: Docs

# Manual for now (Actions tab > Docs > Run workflow). Restore `push: branches: [main]` here once
# the first manual run succeeds.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check generated tutorial files and steps
        run: |
          scripts/sync-tutorial-code.sh --check
          scripts/check-tutorial-steps.sh
      - name: Build the site
        env:
          DOCS_BASE_PATH: ${{ github.event.repository.name }}
        run: scripts/docs.sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
